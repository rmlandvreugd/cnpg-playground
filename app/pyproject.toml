[project]
name = "demo-app"
version = "0.1.0"
description = "Litestar task tracker demo app"
requires-python = ">=3.12"
dependencies = [
    "litestar[standard]>=2.12",
    "advanced-alchemy[litestar]>=1.0",
    "uvicorn[standard]>=0.32",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp>=1.28",
    "opentelemetry-instrumentation-asgi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-asyncpg>=0.49b0",
    "opentelemetry-instrumentation-logging>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "prometheus-client>=0.21",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_app"]

[tool.litestar]
app = "demo_app.main:create_app"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
