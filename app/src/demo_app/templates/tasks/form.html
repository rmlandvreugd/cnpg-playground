{% extends "base.html" %}

{% block title %}{% if task %}Edit Task{% else %}New Task{% endif %} - Demo App{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{% if task %}Edit Task #{{ task.id }}{% else %}New Task{% endif %}</h1>
    <a href="/tasks" class="btn btn-outline">Cancel</a>
</div>

<form method="POST" action="{{ action }}" class="task-form">
    <div class="form-group">
        <label for="title">Title *</label>
        <input type="text" id="title" name="title" required
               value="{{ task.title if task else '' }}"
               placeholder="Enter task title">
    </div>

    <div class="form-group">
        <label for="done">Status</label>
        <select id="done" name="done">
            <option value="false" {% if not task or not task.done %}selected{% endif %}>Pending</option>
            <option value="true" {% if task and task.done %}selected{% endif %}>Done</option>
        </select>
    </div>

    <div class="form-group">
        <label for="assignee">Assignee</label>
        <input type="text" id="assignee" name="assignee"
               value="{{ task.assignee if task and task.assignee else '' }}"
               placeholder="Optional assignee name">
    </div>

    <div class="form-group">
        <label for="priority">Priority</label>
        <select id="priority" name="priority">
            <option value="" {% if not task or not task.priority %}selected{% endif %}>None</option>
            <option value="1" {% if task and task.priority == 1 %}selected{% endif %}>1 - Highest</option>
            <option value="2" {% if task and task.priority == 2 %}selected{% endif %}>2 - High</option>
            <option value="3" {% if task and task.priority == 3 %}selected{% endif %}>3 - Medium</option>
            <option value="4" {% if task and task.priority == 4 %}selected{% endif %}>4 - Low</option>
            <option value="5" {% if task and task.priority == 5 %}selected{% endif %}>5 - Lowest</option>
        </select>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">{% if task %}Update{% else %}Create{% endif %} Task</button>
        <a href="/tasks" class="btn btn-outline">Cancel</a>
    </div>
</form>
{% endblock %}
