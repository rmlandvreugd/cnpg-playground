# RBR VER environment overrides for demo-app
# global.traefikIpDashed is injected by setup.sh after ArgoCD bootstrap via kubectl patch application
global:
  traefikIpDashed: ""

replicaCount: 1

image:
  pullPolicy: Never  # image is loaded into Kind by setup.sh via kind load docker-image

database:
  host: "pooler-verstappen-rw.rbr-ver-db.svc.cluster.local"
  migrationHost: "verstappen-rw.rbr-ver-db.svc.cluster.local"
  name: "max"  # CNPG bootstrap.initdb.database from cluster-verstappen.yaml.tpl
  passwordSecret: "verstappen-app"
  credentialsMode: "static"
  staticSecret:
    refreshInterval: 5m
    # Same KV secret CNPG pins the 'app' role to (rbr-ver-db/verstappen-app ES,
    # store vault-approle-rbr, key cnpg/rbr/ver/app). The app must authenticate
    # with the password CNPG writes onto the role, not the Vault DB static-role.
    vaultPath: "rbr/ver/app"

tls:
  hostnamePrefix: "demo-rbr-ver"
  issuerRef:
    kind: ClusterIssuer
    name: vault-pki

app:
  seed: true

# Pin the demo-app to the (untainted) app node pool.
nodeSelector:
  node-role.kubernetes.io/app: ""

migration:
  strategy: "initContainer"

externalSecret:
  # Point at the SAME Vault KV secret CNPG uses to set the 'app' role password
  # (store vault-approle-rbr mounts KV path 'cnpg', key resolves to cnpg/rbr/ver/app).
  # Previously this pulled the Vault DB static-role (database/static-creds/app),
  # whose password never matches the role value CNPG reconciles -> SASL auth fail.
  secretStoreRef:
    name: vault-approle-rbr
    kind: ClusterSecretStore
  data:
    - secretKey: username
      remoteRef:
        key: rbr/ver/app
        property: username
    - secretKey: password
      remoteRef:
        key: rbr/ver/app
        property: password
