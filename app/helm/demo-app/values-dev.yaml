replicaCount: 1

image:
  tag: "dev"
  pullPolicy: Always

app:
  debug: true
  logLevel: "DEBUG"
  reload: true
  seed: true

database:
  schema: "dev"

migration:
  strategy: "startup"

# --reload forks a second full Python interpreter (litestar[standard] +
# advanced-alchemy + otel), so dev needs at least as much memory as prod.
# 128Mi OOM-killed the reload worker before it could bind :8000.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

tls:
  hostnamePrefix: "demo-dev-demo"
