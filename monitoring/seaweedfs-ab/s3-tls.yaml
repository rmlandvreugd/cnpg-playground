# TLS server cert for the seaweedfs-ab S3 gateway, plus the Service that
# actually exposes the HTTPS listener.
#
# Why a separate Service: the operator derives BOTH the container ports and its
# own `seaweedfs-ab-s3` Service from spec.s3.port alone, so it publishes only the
# HTTP port. The HTTPS listener added via `-s3.port.https=8333` appears in
# neither, and spec.s3.service accepts only annotations/clusterIP/
# loadBalancerIP/type — no ports. Without this Service the TLS listener is up but
# unroutable. The selector matches the labels the operator stamps on its s3 pods.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: seaweedfs-ab-s3-tls
  namespace: grafana
spec:
  secretName: seaweedfs-ab-s3-tls
  issuerRef:
    kind: ClusterIssuer
    name: vault-pki
  commonName: seaweedfs-ab-s3-https.grafana.svc.cluster.local
  dnsNames:
    # Clients reach TLS through the companion Service below, so ITS name must be
    # covered — a cert for seaweedfs-ab-s3 alone would fail verification against
    # https://seaweedfs-ab-s3-https:8333. The operator's own Service name is
    # covered too, so the cert keeps working if 8333 is ever published there.
    - seaweedfs-ab-s3-https.grafana.svc.cluster.local
    - seaweedfs-ab-s3-https.grafana
    - seaweedfs-ab-s3-https
    - seaweedfs-ab-s3.grafana.svc.cluster.local
    - seaweedfs-ab-s3.grafana
    - seaweedfs-ab-s3
  duration: 720h
  renewBefore: 24h
  privateKey:
    algorithm: ECDSA
    size: 256
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-ab-s3-https
  namespace: grafana
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: seaweedfs-ab
    app.kubernetes.io/component: s3
spec:
  selector:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: seaweedfs-ab
    app.kubernetes.io/component: s3
    app.kubernetes.io/managed-by: seaweedfs-operator
  ports:
    - name: s3-https
      port: 8333
      targetPort: 8333
      protocol: TCP
