apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-clusters
  namespace: cnpg-system
spec:
  namespaceSelector:
    any: true
  selector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
      # Instances only. CNPG also sets cnpg.io/cluster on the PgBouncer pods of
      # every Pooler, so without this they were scraped twice — here AND by the
      # cnpg-poolers PodMonitor — doubling every cnpg_pgbouncer_* series
      # (246 each under job cnpg-clusters and cnpg-poolers). Bead rk2c.
      - key: cnpg.io/podRole
        operator: In
        values: [instance]
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
