# ServiceMonitor for the Kyverno control plane.
#
# Kyverno is installed by scripts/setup.sh BEFORE the Prometheus Operator CRDs exist
# (kube-prometheus-stack is installed later by monitoring/setup.sh), so the chart's
# built-in serviceMonitor option cannot be used at install time. The chart always
# creates the per-controller "*-metrics" Services; this standalone ServiceMonitor is
# applied here, after the CRDs exist.
#
# All four metrics Services (admission / background / cleanup / reports controllers)
# share the label app.kubernetes.io/part-of=kyverno and expose port "metrics-port"
# (8000). Non-metrics Services that share the label have no "metrics-port" endpoint and
# are simply skipped by the Operator.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kyverno
  namespace: kyverno
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: kyverno
  endpoints:
    - port: metrics-port
      path: /metrics
      scheme: http
