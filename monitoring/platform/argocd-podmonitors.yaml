# PodMonitor for the Argo CD control plane.
#
# This Argo CD install does NOT ship the usual "argocd-*-metrics" Services, so there is
# nothing for a ServiceMonitor to select. The component pods do expose metrics on a named
# container port "metrics", however:
#
#   application-controller      8082
#   server                      8083
#   repo-server                 8084
#   applicationset-controller   8080
#   notifications-controller    9001
#
# All Argo CD pods carry app.kubernetes.io/part-of=argocd, so a single PodMonitor selecting
# that label and the "metrics" port covers every component (pods without a "metrics" port
# are skipped). The cluster Prometheus has podMonitorSelector={} / podMonitorNamespaceSelector={},
# so this is discovered without extra labels.
#
# dex-server is not deployed (dex.enabled: false in argocd/values.yaml): SSO uses
# oidc.config directly against Authelia, so the dex-server pod never ran an actual
# dex process anyway ("dex is not configured") and would have been a permanently-down
# metrics target.
#
# Applied by monitoring/setup.sh after the Prometheus Operator CRDs exist (Argo CD is
# installed earlier by scripts/setup.sh).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: argocd
  namespace: argocd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: argocd
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      scheme: http
