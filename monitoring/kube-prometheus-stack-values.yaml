prometheus:
  enabled: false
grafana:
  enabled: false
alertmanager:
  enabled: false

prometheusOperator:
  enabled: true
  # Issue the admission webhook serving cert via cert-manager (already installed) instead
  # of the default kube-webhook-certgen pre-install Helm hook Job. That hook must complete
  # before `helm --wait` creates any chart resource; on a fresh cluster its uncached
  # ghcr.io image pull + Calico CNI race made it exceed the 360s timeout (context canceled).
  # cainjector injects the CA into the webhook configs; helm --wait does not block on the
  # Certificate CRs, so the install no longer hangs.
  admissionWebhooks:
    certManager:
      enabled: true

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
prometheus-node-exporter:
  tolerations:
    - operator: Exists  # cover all nodes including infra/control-plane

kubeApiServer:
  enabled: true
kubelet:
  enabled: true
  serviceMonitor:
    cAdvisor: true
    probes: true
coreDns:
  enabled: true
kubeProxy:
  enabled: true

# Kept enabled per locked decision; DOWN targets expected in kind
kubeControllerManager:
  enabled: true
kubeScheduler:
  enabled: true
kubeEtcd:
  enabled: true
  service:
    enabled: true
    port: 2381
    targetPort: 2381
  serviceMonitor:
    scheme: http
    insecureSkipVerify: true

defaultRules:
  create: true
