# Single-replica tempo-distributed; RustFS S3 backend; OTLP gRPC + HTTP receivers.
#
# NOTE: global.extraVolumes/extraVolumeMounts are unreliable in tempo-distributed — they
# propagate to standard Deployments but NOT to StatefulSets (ingester) or metricsGenerator.
# All CA bundle volumes and mounts are declared per-component for consistent behaviour.

minio:
  enabled: false  # bundled MinIO unused — RustFS provides S3

storage:
  trace:
    backend: s3
    s3:
      bucket: tempo
      endpoint: objectstore-local.tempo.svc.cluster.local:9000
      region: us-east-1
      insecure: false
      tls_ca_path: /etc/ssl/step-ca/ca-certificates.crt
      # access_key / secret_key injected via --set in setup.sh

# Per-component CA bundle injection. Each component declares extraVolumes + extraVolumeMounts
# so the step-ca-bundle ConfigMap is both registered in the pod spec and mounted to the container.
ingester:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  config:
    replication_factor: 1  # single-node: avoids "at least 2 live replicas required" error
  extraVolumes:
    - name: step-ca-bundle
      configMap:
        name: step-ca-external-bundle
  extraVolumeMounts:
    - name: step-ca-bundle
      mountPath: /etc/ssl/step-ca
      readOnly: true

distributor:
  replicas: 1
  extraVolumes:
    - name: step-ca-bundle
      configMap:
        name: step-ca-external-bundle
  extraVolumeMounts:
    - name: step-ca-bundle
      mountPath: /etc/ssl/step-ca
      readOnly: true

compactor:
  replicas: 1
  extraVolumes:
    - name: step-ca-bundle
      configMap:
        name: step-ca-external-bundle
  extraVolumeMounts:
    - name: step-ca-bundle
      mountPath: /etc/ssl/step-ca
      readOnly: true

querier:
  replicas: 1
  extraVolumes:
    - name: step-ca-bundle
      configMap:
        name: step-ca-external-bundle
  extraVolumeMounts:
    - name: step-ca-bundle
      mountPath: /etc/ssl/step-ca
      readOnly: true

queryFrontend:
  replicas: 1
  extraVolumes:
    - name: step-ca-bundle
      configMap:
        name: step-ca-external-bundle
  extraVolumeMounts:
    - name: step-ca-bundle
      mountPath: /etc/ssl/step-ca
      readOnly: true

metricsGenerator:
  enabled: true
  replicas: 1
  extraVolumes:
    - name: step-ca-bundle
      configMap:
        name: step-ca-external-bundle
  extraVolumeMounts:
    - name: step-ca-bundle
      mountPath: /etc/ssl/step-ca
      readOnly: true
  config:
    registry:
      external_labels:
        source: tempo
    storage:
      remote_write:
        - url: http://mimir-nginx.mimir.svc.cluster.local/api/v1/push
          headers:
            X-Scope-OrgID: tempo
    processor:
      local_blocks:
        max_live_traces: 50000
        max_block_duration: 5m
        max_block_bytes: 314572800
        flush_check_period: 10s
        trace_idle_period: 10s
        complete_block_timeout: 15m
        filter_server_spans: false

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]

traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true

tempo:
  nodeSelector:
    node-role.kubernetes.io/infra: ""
  tolerations:
    - key: node-role.kubernetes.io/infra
      operator: Exists
      effect: NoSchedule
