# Loki-B (release "loki-seaweedfs") — storage arm B: in-cluster SeaweedFS
# managed by seaweedfs-operator (bead 8ti), mirrored to RustFS loki-mirror.
#
# Layered ON TOP of loki-values-common.yaml. Only storage differs here.
#
# Endpoint is seaweedfs-ab-s3-HTTPS, not the operator's own seaweedfs-ab-s3
# Service. The operator derives its Service from spec.s3.port and publishes only
# the HTTP port (8334); the TLS listener on 8333 is exposed by the companion
# Service created in monitoring/seaweedfs-ab/s3-tls.yaml. Pointing at
# seaweedfs-ab-s3:8333 would simply have no such port.
#
# The gateway cert is vault-pki issued, but vault-pki is itself step-ca signed
# and the gateway serves its intermediate, so the SAME step-ca-external-bundle
# the other two arms use validates it — verified against the live endpoint.
# Using one bundle everywhere keeps the arms identical outside storage.
---
# REQUIRED to run more than one Loki release in one namespace — see the same
# note in loki-values-rustfs.yaml. Without it this release tries to take over
# the "loki" ConfigMap already owned by the Loki-C release and the install
# aborts on Helm ownership metadata.
nameOverride: loki-seaweedfs

loki:
  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki
      admin: loki
    s3:
      endpoint: https://seaweedfs-ab-s3-https.grafana.svc.cluster.local:8333
      region: us-east-1
      accessKeyId: ${S3_ACCESS_KEY_ID}
      secretAccessKey: ${S3_SECRET_ACCESS_KEY}
      s3ForcePathStyle: true
      insecure: false
      http_config:
        ca_file: /etc/ssl/step-ca/ca-certificates.crt

singleBinary:
  extraEnvFrom:
    - secretRef:
        name: loki-seaweedfs-s3
