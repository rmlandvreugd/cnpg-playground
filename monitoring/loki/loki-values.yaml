# Loki-C (release "loki") — storage arm C, the CONTROL: the host SeaweedFS
# container. Same software as arm B, same location as arm A, which is what makes
# it the control for both comparisons.
#
# Layered ON TOP of loki-values-common.yaml. Everything that is not storage now
# lives there, so this arm cannot drift from the other two.
#
# NOTE: this release keeps the name "loki" and the bucket "loki" it has always
# had, so existing datasources and dashboards keep working while the PoC runs.
---
loki:
  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki
      admin: loki
    s3:
      endpoint: https://seaweedfs.grafana.svc.cluster.local:8333
      region: us-east-1
      # Previously injected with --set, which wrote the secret in PLAINTEXT into
      # ConfigMap 'loki'. Now expanded at runtime from the Secret below.
      accessKeyId: ${S3_ACCESS_KEY_ID}
      secretAccessKey: ${S3_SECRET_ACCESS_KEY}
      s3ForcePathStyle: true
      insecure: false
      http_config:
        ca_file: /etc/ssl/step-ca/ca-certificates.crt

singleBinary:
  extraEnvFrom:
    - secretRef:
        name: loki-s3
