deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki
      admin: loki
    s3:
      endpoint: https://seaweedfs.grafana.svc.cluster.local:8333
      region: us-east-1
      # accessKeyId and secretAccessKey injected via --set from SEAWEEDFS_ACCESS_KEY/SECRET_KEY
      s3ForcePathStyle: true
      insecure: false
      http_config:
        ca_file: /etc/ssl/step-ca/ca-certificates.crt
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    retention_period: 3d
    ingestion_rate_mb: 32
    ingestion_burst_size_mb: 64
    otlp_config:
      resource_attributes:
        attributes_config:
          - action: index_label
            attributes:
              - service.name
              - host.name

singleBinary:
  replicas: 1
  nodeSelector:
    node-role.kubernetes.io/infra: ""
  tolerations:
    - key: node-role.kubernetes.io/infra
      operator: Exists
      effect: NoSchedule
  persistence:
    enabled: true
    size: 20Gi
  extraVolumes:
    - name: step-ca-bundle
      configMap:
        name: step-ca-external-bundle
  extraVolumeMounts:
    - name: step-ca-bundle
      mountPath: /etc/ssl/step-ca
      readOnly: true

# Disable distributed-mode components
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# Disable bundled cache/minio
chunksCache:
  enabled: false
resultsCache:
  enabled: false
minio:
  enabled: false

# Disable self-monitoring and canary (require extra dependencies)
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false
  serviceMonitor:
    enabled: false

test:
  enabled: false
gateway:
  enabled: false
