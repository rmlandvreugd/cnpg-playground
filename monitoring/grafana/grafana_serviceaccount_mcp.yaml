# Admin service account for the Grafana MCP server. grafana-operator (re)creates the
# account and writes a fresh token to Secret grafana-mcp-token whenever the Grafana pod
# restarts (its data is emptyDir); scripts/mcp-grafana.sh reads it at MCP launch.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaServiceAccount
metadata:
  name: grafana-mcp
spec:
  instanceName: grafana
  name: mcp
  role: Admin
  tokens:
    - name: mcp
      secretName: grafana-mcp-token
