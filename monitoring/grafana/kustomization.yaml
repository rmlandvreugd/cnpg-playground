apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana
resources:
  # The platform datasources whose X-Scope-OrgID lists the tenants are rendered and
  # applied by scripts/tenant-telemetry.sh (bd3d.7), not from here.
  # grafana_instance.yaml is rendered from grafana_instance.yaml.tpl by monitoring/setup.sh
  - grafana_serviceaccount_mcp.yaml
  - grafana_datasource.yaml
  - grafana_dashboard.yaml
  - grafana_dashboard_pgaudit.yaml
  - grafana_dashboard_node_exporter.yaml
  - grafana_dashboard_kube_state.yaml
  - grafana_dashboard_k8s_global.yaml
  - grafana_dashboard_k8s_pods.yaml
  - grafana_dashboard_k8s_events.yaml
  - grafana_dashboard_k8s_pod_logs.yaml
  - grafana_datasource_mimir.yaml
  - grafana_dashboard_cnpg_custom.yaml
  - grafana_dashboard_cnpg_backup.yaml
  - grafana_dashboard_traefik_traces.yaml
  - grafana_dashboard_pki.yaml
  - grafana_dashboard_capsule.yaml
  - grafana_dashboard_calico.yaml
  - grafana_dashboard_kyverno.yaml
  - grafana_dashboard_argocd.yaml
