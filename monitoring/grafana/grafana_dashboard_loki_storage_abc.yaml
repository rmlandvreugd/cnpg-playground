# A/B/C Loki storage benchmark dashboard (bead cnpg-playground-t9p7.3).
#
# Three VERDICT panels decide the comparison — query latency, S3 operation
# latency, and resource cost — with supporting panels below them.
#
# Every expression here uses a metric verified to exist on this cluster. In
# particular loki_s3_request_duration_seconds carries the SAME name on all three
# arms, which is only true because the Loki chart renders
# use_thanos_objstore=false; if that ever flips, arms would stop being
# comparable rather than obviously breaking.
#
# Reads from Mimir, not Prometheus: the soak runs >=26h and Prometheus retention
# is shorter than the window the verdict needs.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: loki-storage-abc
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  json: |
    {
      "title": "Loki Storage A/B/C Benchmark",
      "uid": "loki-storage-abc",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {"from": "now-6h", "to": "now"},
      "tags": ["loki", "storage", "benchmark"],
      "templating": {
        "list": [
          {"name":"ds","label":"Metrics","type":"datasource","query":"prometheus","current":{"text":"mimir","value":"mimir"},"hide":0}
        ]
      },
      "panels": [
        {
          "id": 100, "type": "text", "gridPos": {"x":0,"y":0,"w":24,"h":3},
          "options": {"mode":"markdown","content":"### Verdict panels\n\n**A** `loki-rustfs` → RustFS direct · **B** `loki-seaweedfs` → in-cluster SeaweedFS (mirrored) · **C** `loki` → host SeaweedFS (control)\n\nAll three receive identical data, so any difference below is storage. Read results on a **settled** window — at the live edge the arms differ only by chunk-flush timing, which is the thing being measured. All three stores share one WSL disk, so this compares protocol and code paths, not independent spindles."}
        },

        {
          "id": 1, "title": "VERDICT 1 — query latency p99 (store-served ranges)", "type": "timeseries",
          "gridPos": {"x":0,"y":3,"w":12,"h":8},
          "datasource": {"type":"prometheus","uid":"${ds}"},
          "fieldConfig": {"defaults":{"unit":"s","custom":{"lineWidth":2,"fillOpacity":5}}},
          "targets": [{
            "refId":"A",
            "expr":"histogram_quantile(0.99, sum by (job, le) (rate(loki_request_duration_seconds_bucket{job=~\"grafana/loki|grafana/loki-rustfs|grafana/loki-seaweedfs\", route=~\"loki_api_v1_query_range|loki_api_v1_query\"}[5m])))",
            "legendFormat":"{{job}} p99"
          }]
        },
        {
          "id": 2, "title": "VERDICT 1b — query latency p50", "type": "timeseries",
          "gridPos": {"x":12,"y":3,"w":12,"h":8},
          "datasource": {"type":"prometheus","uid":"${ds}"},
          "fieldConfig": {"defaults":{"unit":"s","custom":{"lineWidth":2,"fillOpacity":5}}},
          "targets": [{
            "refId":"A",
            "expr":"histogram_quantile(0.50, sum by (job, le) (rate(loki_request_duration_seconds_bucket{job=~\"grafana/loki|grafana/loki-rustfs|grafana/loki-seaweedfs\", route=~\"loki_api_v1_query_range|loki_api_v1_query\"}[5m])))",
            "legendFormat":"{{job}} p50"
          }]
        },

        {
          "id": 3, "title": "VERDICT 2 — S3 operation latency p99 by operation", "type": "timeseries",
          "gridPos": {"x":0,"y":11,"w":12,"h":8},
          "datasource": {"type":"prometheus","uid":"${ds}"},
          "fieldConfig": {"defaults":{"unit":"s","custom":{"lineWidth":2,"fillOpacity":5}}},
          "targets": [{
            "refId":"A",
            "expr":"histogram_quantile(0.99, sum by (job, operation, le) (rate(loki_s3_request_duration_seconds_bucket{job=~\"grafana/loki|grafana/loki-rustfs|grafana/loki-seaweedfs\"}[5m])))",
            "legendFormat":"{{job}} {{operation}}"
          }]
        },
        {
          "id": 4, "title": "VERDICT 2b — S3 operation latency p50 by operation", "type": "timeseries",
          "gridPos": {"x":12,"y":11,"w":12,"h":8},
          "datasource": {"type":"prometheus","uid":"${ds}"},
          "fieldConfig": {"defaults":{"unit":"s","custom":{"lineWidth":2,"fillOpacity":5}}},
          "targets": [{
            "refId":"A",
            "expr":"histogram_quantile(0.50, sum by (job, operation, le) (rate(loki_s3_request_duration_seconds_bucket{job=~\"grafana/loki|grafana/loki-rustfs|grafana/loki-seaweedfs\"}[5m])))",
            "legendFormat":"{{job}} {{operation}}"
          }]
        },

        {
          "id": 5, "title": "VERDICT 3 — resource cost: CPU (Loki pods)", "type": "timeseries",
          "gridPos": {"x":0,"y":19,"w":12,"h":8},
          "datasource": {"type":"prometheus","uid":"${ds}"},
          "fieldConfig": {"defaults":{"unit":"percentunit","custom":{"lineWidth":2,"fillOpacity":5}}},
          "targets": [{
            "refId":"A",
            "expr":"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"grafana\", pod=~\"loki-0|loki-rustfs-0|loki-seaweedfs-0\", container!=\"\"}[5m]))",
            "legendFormat":"{{pod}}"
          }]
        },
        {
          "id": 6, "title": "VERDICT 3b — resource cost: memory (Loki + store pods)", "type": "timeseries",
          "gridPos": {"x":12,"y":19,"w":12,"h":8},
          "datasource": {"type":"prometheus","uid":"${ds}"},
          "fieldConfig": {"defaults":{"unit":"bytes","custom":{"lineWidth":2,"fillOpacity":5}}},
          "targets": [{
            "refId":"A",
            "expr":"sum by (pod) (container_memory_working_set_bytes{namespace=\"grafana\", pod=~\"loki-0|loki-rustfs-0|loki-seaweedfs-0|seaweedfs-ab-.*\", container!=\"\"})",
            "legendFormat":"{{pod}}"
          }]
        },

        {
          "id": 200, "type": "text", "gridPos": {"x":0,"y":27,"w":24,"h":2},
          "options": {"mode":"markdown","content":"### Supporting signal"}
        },

        {
          "id": 7, "title": "S3 operation rate by arm and operation", "type": "timeseries",
          "gridPos": {"x":0,"y":29,"w":12,"h":7},
          "datasource": {"type":"prometheus","uid":"${ds}"},
          "fieldConfig": {"defaults":{"unit":"reqps"}},
          "targets": [{
            "refId":"A",
            "expr":"sum by (job, operation) (rate(loki_s3_request_duration_seconds_count{job=~\"grafana/loki|grafana/loki-rustfs|grafana/loki-seaweedfs\"}[5m]))",
            "legendFormat":"{{job}} {{operation}}"
          }]
        },
        {
          "id": 8, "title": "Ingester flush queue length (backpressure)", "type": "timeseries",
          "gridPos": {"x":12,"y":29,"w":12,"h":7},
          "datasource": {"type":"prometheus","uid":"${ds}"},
          "targets": [{
            "refId":"A",
            "expr":"sum by (job) (loki_ingester_flush_queue_length{job=~\"grafana/loki|grafana/loki-rustfs|grafana/loki-seaweedfs\"})",
            "legendFormat":"{{job}}"
          }]
        },

        {
          "id": 9, "title": "Compactor retention run duration", "type": "timeseries",
          "gridPos": {"x":0,"y":36,"w":12,"h":7},
          "datasource": {"type":"prometheus","uid":"${ds}"},
          "fieldConfig": {"defaults":{"unit":"s"}},
          "targets": [{
            "refId":"A",
            "expr":"sum by (job) (rate(loki_compactor_apply_retention_operation_duration_seconds_sum{job=~\"grafana/loki|grafana/loki-rustfs|grafana/loki-seaweedfs\"}[10m])) / clamp_min(sum by (job) (rate(loki_compactor_apply_retention_operation_duration_seconds_count{job=~\"grafana/loki|grafana/loki-rustfs|grafana/loki-seaweedfs\"}[10m])), 1)",
            "legendFormat":"{{job}}"
          }]
        },
        {
          "id": 10, "title": "filer.backup mirror upload (covariate for arm A)", "type": "timeseries",
          "gridPos": {"x":12,"y":36,"w":12,"h":7},
          "datasource": {"type":"prometheus","uid":"${ds}"},
          "fieldConfig": {"defaults":{"unit":"bytes"}},
          "description": "The mirror writes into the SAME RustFS instance that backs arm A, so its activity is a confounder for arm A's numbers, not an independent signal. Read arm A's latency against this.",
          "targets": [
            {"refId":"A","expr":"sum(SeaweedFS_filer_in_flight_upload_bytes{job=\"seaweedfs-ab-filer\"})","legendFormat":"filer in-flight upload bytes"},
            {"refId":"B","expr":"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"grafana\", pod=~\"seaweedfs-ab-filer-.*\", container=\"filer-backup-rustfs\"}[5m]))","legendFormat":"{{pod}} sidecar CPU"}
          ]
        },

        {
          "id": 11, "title": "SeaweedFS store: filer request latency p99 (arm B)", "type": "timeseries",
          "gridPos": {"x":0,"y":43,"w":12,"h":7},
          "datasource": {"type":"prometheus","uid":"${ds}"},
          "fieldConfig": {"defaults":{"unit":"s"}},
          "targets": [{
            "refId":"A",
            "expr":"histogram_quantile(0.99, sum by (type, le) (rate(SeaweedFS_filerStore_request_seconds_bucket{job=\"seaweedfs-ab-filer\"}[5m])))",
            "legendFormat":"{{type}}"
          }]
        },
        {
          "id": 12, "title": "SeaweedFS store: volumes and CPU (arm B)", "type": "timeseries",
          "gridPos": {"x":12,"y":43,"w":12,"h":7},
          "datasource": {"type":"prometheus","uid":"${ds}"},
          "targets": [
            {"refId":"A","expr":"sum by (job) (SeaweedFS_volumeServer_volumes{job=~\"seaweedfs-ab-volume.*\"})","legendFormat":"{{job}} volumes"},
            {"refId":"B","expr":"sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"grafana\", pod=~\"seaweedfs-ab-.*\", container!=\"\"}[5m]))","legendFormat":"{{pod}} CPU"}
          ]
        },

        {
          "id": 13, "title": "Synthetic load: flog ingest rate per arm (parity check)", "type": "timeseries",
          "gridPos": {"x":0,"y":50,"w":24,"h":7},
          "datasource": {"type":"prometheus","uid":"${ds}"},
          "description": "The three arms receive identical data. A persistent gap here means the fan-out itself is broken and the verdict panels above are not comparing like with like.",
          "fieldConfig": {"defaults":{"unit":"Bps"}},
          "targets": [{
            "refId":"A",
            "expr":"sum by (job) (rate(loki_distributor_bytes_received_total{job=~\"grafana/loki|grafana/loki-rustfs|grafana/loki-seaweedfs\"}[5m]))",
            "legendFormat":"{{job}}"
          }]
        }
      ]
    }
