apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: pgaudit-dashboard
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  json: |
    {
      "title": "pgaudit Audit Logs",
      "uid": "cnpg-pgaudit",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Loki",
            "type": "datasource",
            "query": "loki",
            "hide": 0
          },
          {
            "name": "cluster",
            "label": "Cluster",
            "type": "query",
            "datasource": {"type": "loki", "uid": "${datasource}"},
            "query": {"label": "cluster", "type": 1},
            "refresh": 2,
            "hide": 0,
            "multi": false,
            "includeAll": true,
            "allValue": ".+"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Audit Events per Minute",
          "description": "CNPG emits pgaudit as structured JSON (logger=pgaudit, fields under record.audit), not as text with an AUDIT: prefix, so the queries parse json and filter on logger. The CNPG metrics exporter is excluded: its session SETs are audited on every scrape and are ~99% of all audit lines.",
          "type": "timeseries",
          "gridPos": {"x": 0, "y": 0, "w": 24, "h": 8},
          "datasource": {"type": "loki", "uid": "${datasource}"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (cluster, record_audit_class, record_audit_command) (count_over_time({cluster=~\"$cluster\", container=\"postgres\"} | json | logger=\"pgaudit\" | record_user_name!=\"cnpg_metrics_exporter\" [1m]))",
              "legendFormat": "{{cluster}} / {{record_audit_class}} {{record_audit_command}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Audit Log Stream",
          "type": "logs",
          "gridPos": {"x": 0, "y": 8, "w": 24, "h": 16},
          "datasource": {"type": "loki", "uid": "${datasource}"},
          "targets": [
            {
              "refId": "A",
              "expr": "{cluster=~\"$cluster\", container=\"postgres\"} | json | logger=\"pgaudit\" | record_user_name!=\"cnpg_metrics_exporter\" | line_format \"{{.record_user_name}}@{{.record_database_name}} [{{.record_audit_class}}] {{.record_audit_command}}: {{.record_audit_statement}}\""
            }
          ],
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "showTime": true,
            "wrapLogMessage": true
          }
        }
      ]
    }
