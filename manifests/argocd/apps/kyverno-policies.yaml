apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: rbr
  source:
    repoURL: https://github.com/rmlandvreugd/cnpg-playground.git
    targetRevision: feature/self-service
    path: manifests/kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
  ignoreDifferences:
    - group: kyverno.io
      kind: ClusterPolicy
      jsonPointers:
        - /status
      # Kyverno's admission webhook injects these spec defaults (absent from git),
      # which otherwise keeps policies like require-resources-probes permanently
      # OutOfSync. spec.background stays diffed (it is set explicitly in git).
      jqPathExpressions:
        - .spec.admission
        - .spec.emitWarning
        - .spec.rules[].skipBackgroundRequests
        - .spec.rules[].validate.allowExistingViolations
