apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resources-probes
  annotations:
    policies.kyverno.io/title: Require resource requests/limits and liveness/readiness probes
    policies.kyverno.io/description: >-
      All containers in tenant namespaces must declare CPU and memory requests+limits,
      and must have liveness and readiness probes configured. Enforces operational
      baseline for quota enforcement and health signalling. Start in Audit.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: require-cpu-memory-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchExpressions:
                  - key: capsule.clastix.io/tenant
                    operator: Exists
      validate:
        message: "All containers must declare CPU and memory requests and limits."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  # Coalesce absent values to '' before comparing: when a container
                  # has no resources block, element.resources.requests.cpu is nil and
                  # `length(@)` throws "Invalid type for: <nil>" on background scan.
                  # '' Equals "" denies when the request/limit is missing (same as the
                  # probe rules below), turning those error results into clean fails.
                  - key: "{{ element.resources.requests.cpu || '' }}"
                    operator: Equals
                    value: ""
                  - key: "{{ element.resources.requests.memory || '' }}"
                    operator: Equals
                    value: ""
                  - key: "{{ element.resources.limits.cpu || '' }}"
                    operator: Equals
                    value: ""
                  - key: "{{ element.resources.limits.memory || '' }}"
                    operator: Equals
                    value: ""

    - name: require-liveness-probe
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchExpressions:
                  - key: capsule.clastix.io/tenant
                    operator: Exists
      validate:
        message: "All containers must have a livenessProbe configured."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                all:
                  # Coalesce absent probe to '' rather than comparing to null:
                  # kyverno strips `value: null` on persist, causing permanent
                  # ArgoCD drift. '' is semantically equivalent (deny when absent).
                  - key: "{{ element.livenessProbe || '' }}"
                    operator: Equals
                    value: ""

    - name: require-readiness-probe
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaceSelector:
                matchExpressions:
                  - key: capsule.clastix.io/tenant
                    operator: Exists
      validate:
        message: "All containers must have a readinessProbe configured."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                all:
                  # See livenessProbe note above: avoid `value: null` drift.
                  - key: "{{ element.readinessProbe || '' }}"
                    operator: Equals
                    value: ""
