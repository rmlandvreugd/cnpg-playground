apiVersion: capsule.clastix.io/v1beta2
kind: Tenant
metadata:
  name: rbr
spec:
  # Every tenant namespace is rbr-*: tenant metrics are routed to Mimir org "rbr" by
  # namespace=~"rbr-.+" (monitoring/prometheus-instance/prometheus-cr.yaml.tpl).
  forceTenantPrefix: true
  owners:
    - name: oidc:capsule-admin
      kind: Group
    - name: oidc:rbr-db-admin
      kind: Group
  additionalRoleBindings:
    - clusterRoleName: view
      subjects:
        - apiGroup: rbac.authorization.k8s.io
          kind: Group
          name: oidc:rbr-po
  ingressOptions:
    hostnameCollisionScope: Tenant
  resourceQuotas:
    scope: Tenant
