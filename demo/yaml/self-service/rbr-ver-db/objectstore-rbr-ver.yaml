apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: objectstore-rbr-ver
  namespace: rbr-ver-db
spec:
  configuration:
    destinationPath: s3://verstappen-backups/
    # SeaweedFS S3 gateway (migrated off RustFS). Hostname 'seaweedfs' matches the
    # step-ca cert SAN; the Service+Endpoints are wired in self-service-setup.sh.
    endpointURL: https://seaweedfs:8333
    endpointCA:
      name: step-ca-external-bundle
      key: ca.crt
    s3Credentials:
      accessKeyId:
        name: seaweedfs-barman
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: seaweedfs-barman
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
