apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus-rbr-ver
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-rbr-ver
  allowCrossNamespaceImport: true
  datasource:
    access: proxy
    name: DS_PROMETHEUS
    # Default, or dashboards with a "prometheus" datasource variable resolve to
    # DS_MIMIR_TEMPO (span metrics only) and show No data.
    isDefault: true
    type: prometheus
    # Mimir org "rbr" holds only this tenant's namespaces (Prometheus remoteWrite keep
    # namespace=~rbr-.+); querying prometheus-operated directly would expose every series.
    url: http://mimir-gateway.mimir.svc.cluster.local/prometheus
    jsonData:
      timeInterval: 15s
      tlsSkipVerify: true
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: rbr
