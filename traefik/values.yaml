nodeSelector:
  node-role.kubernetes.io/infra: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    add:
      - NET_BIND_SERVICE
    drop:
      - ALL

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
    allowExternalNameServices: true

ingressRoute:
  dashboard:
    enabled: false

# chart v41 renamed logs.general -> log and logs.access -> accessLog, camelCased
# field keys, and dropped the fields.general nesting level (v41.0.0 breaking change).
log:
  level: "INFO"

accessLog:
  enabled: true
  format: json
  bufferingSize: 0      # immediate flush
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop  # drop request headers by default (PII)
      names:
        User-Agent: keep
        X-Forwarded-For: keep

tracing:
  serviceName: traefik
  sampleRate: 1.0       # 100% sampling — playground; tune for prod
  otlp:
    enabled: true
    # transport and endpoint set at install time via --set (hub=gRPC, non-hub=HTTP)

additionalArguments:
  - "--global.checknewversion=false"
  - "--global.sendanonymoususage=false"
  - "--ping=true"
  - "--ping.entrypoint=traefik"
  - "--entrypoints.postgres.address=:5432"
  - "--entrypoints.web.http.redirections.entrypoint.to=:443"
  - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
  - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
  # Trust X-Forwarded-* (incl. X-Forwarded-Method) on the internal docker/pod
  # networks so cross-boundary forward-auth to the edge Authelia works: the
  # radar forwardAuth sub-request relays through this entrypoint and the edge
  # Traefik, and Traefik strips X-Forwarded-Method from untrusted sources,
  # which makes Authelia reject forward-auth with 400 "X-Forwarded-Method is
  # empty". Sources here are the kind node net (172.18.0.0/16) or the Calico
  # pod net (10.244.0.0/16) depending on hairpin SNAT.
  - "--entrypoints.websecure.forwardedHeaders.trustedIPs=172.18.0.0/16,10.244.0.0/16"

ports:
  postgres:
    port: 5432
    expose:
      default: false
    exposedPort: 5432
    protocol: TCP

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 128Mi

service:
  type: LoadBalancer
