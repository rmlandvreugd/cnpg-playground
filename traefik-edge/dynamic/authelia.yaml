http:
  routers:
    authelia:
      # Edge portal (host containers: vault, seaweedfs-admin) AND in-cluster
      # portal (hub Traefik proxies authelia.172-18-255-200 here). One Authelia
      # container derives the OIDC issuer per-request from the incoming Host.
      rule: "Host(`authelia.172-18-0-250.sslip.io`) || Host(`authelia.172-18-255-200.sslip.io`)"
      entryPoints:
        - websecure
      service: authelia
      tls: {}

  services:
    authelia:
      loadBalancer:
        serversTransport: insecure-backend
        servers:
          - url: "https://authelia:9091"
